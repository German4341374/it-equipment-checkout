name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  quality:
    name: Format, build, test, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore locked dependencies
        run: dotnet restore ItEquipmentCheckout.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format ItEquipmentCheckout.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ItEquipmentCheckout.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test ItEquipmentCheckout.slnx
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Verify migration is current
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/ItEquipmentCheckout.Web
          --startup-project src/ItEquipmentCheckout.Web
          --no-build
          --configuration Release

      - name: Audit dependencies
        run: dotnet list ItEquipmentCheckout.slnx package --vulnerable --include-transitive

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults
          if-no-files-found: error
          retention-days: 14

  container:
    name: Container build and vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag it-equipment-checkout:ci .

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: it-equipment-checkout:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
